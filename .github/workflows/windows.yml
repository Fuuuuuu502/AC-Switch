name: Windows x64 build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: pnpm
      - name: Install stable Rust
        run: rustup default stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled Node
        run: ./scripts/prepare-node.ps1
      - name: Check Rust and Windows helpers
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - name: Test presets and endpoint validation
        run: node --test tests/presets.test.cjs tests/provider-endpoint.test.mjs
      - name: Test local protocols
        run: node --test tests/sidecars.test.cjs
      - name: Build Windows installer
        run: pnpm tauri build
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AC-Switch-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 14
